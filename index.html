<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EsProfe</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<header class="header">

    <div class="logo">
        EsProfe
    </div>

    <div class="language-selector">

        <select id="language">

            <option value="ru">Русский</option>
            <option value="uk">Українська</option>
            <option value="en">English</option>
            <option value="es">Español</option>

        </select>

    </div>

</header>


<main>

    <!-- Главный экран -->

    <section class="hero">

        <h1 id="title">
            Изучаем испанский язык
        </h1>

        <p id="subtitle">
            Интерактивная образовательная платформа
        </p>

    </section>


    <!-- Тренажёр -->

    <section class="trainer">

        <div class="card">

            <h2 id="verb">
                Загрузка...
            </h2>

            <p id="translation">
                ...
            </p>

            <p id="status">
                Загрузка базы глаголов...
            </p>


            <!-- Здесь будет задание -->

            <div class="exercise">

                <p id="person">
                    yo
                </p>

                <input
                    type="text"
                    id="answer"
                    placeholder="Введите ответ"
                    autocomplete="off"
                >

                <button id="checkAnswer">
                    Проверить
                </button>

                <p id="result"></p>

            </div>


            <!-- Следующий глагол -->

            <button id="nextVerb">

                Следующий глагол

            </button>

        </div>

    </section>

</main>


<footer>

    EsProfe © 2026

</footer>


<script src="js/translator.js"></script>
<script src="js/app.js"></script>

</body>

</html>
