<text x="330" y="335" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#2457a6">Единственное число</text><text x="870" y="335" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#2457a6">Множественное число</text>
