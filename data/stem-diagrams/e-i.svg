<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2f9e44"/></marker></defs>
<rect width="1200" height="900" rx="28" fill="#fff"/>
<text x="48" y="62" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#172033">pedir — e → <tspan fill="#2f9e44">i</tspan></text>
<text x="48" y="100" font-family="Arial,sans-serif" font-size="21" fill="#334155">La vocal de la raíz <tspan font-weight="700">e</tspan> cambia a <tspan fill="#2f9e44" font-weight="700">i</tspan> en cuatro formas. Nosotros y vosotros mantienen la raíz.</text>
<rect x="485" y="132" width="230" height="120" rx="18" fill="#f4fff0" stroke="#a8d88e" stroke-width="2"/>
<text x="600" y="187" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="700">p<tspan fill="#2f9e44">e</tspan>dir</text><text x="600" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#64748b">(инфинитив)</text>
