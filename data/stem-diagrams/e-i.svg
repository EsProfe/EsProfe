<rect x="90" y="805" width="1020" height="62" rx="14" fill="#fff7e8"/><text x="110" y="832" font-family="Arial,sans-serif" font-size="17" fill="#7a4b00"><tspan font-weight="700">Nosotros y vosotros:</tspan> la vocal de la raíz se mantiene igual que en el infinitivo.</text><text x="110" y="855" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#7a4b00">Las terminaciones siguen siendo las normales del presente.</text>
