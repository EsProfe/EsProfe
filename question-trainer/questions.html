<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>EsProfe · Preguntas</title><link rel="stylesheet" href="style.css"><style>
body{min-height:100dvh} .trainer-wrap{max-width:660px;margin:clamp(12px,4vh,35px) auto;padding:0 16px}.trainer-header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.trainer-back{color:#176b87;font-weight:700;text-decoration:none}.trainer-header select{max-width:150px}.trainer-wrap h1{font-size:clamp(1.3rem,4vw,1.8rem);margin:14px 0 4px}.trainer-intro{color:#5c7c8b;margin:0 0 12px}.card-counter{font-size:.85rem;font-weight:700;color:#5c7c8b;margin:5px 0}.flip-card{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;width:100%;min-height:min(37vh,260px);padding:20px;border:1px solid #c9e4ec;border-radius:20px;background:white;color:#19495c;box-shadow:0 8px 25px #a6c9d23b;cursor:pointer}.flip-card:focus-visible{outline:3px solid #f39937;outline-offset:3px}.card-label{font-size:.8rem;color:#698997}.card-word{font-size:clamp(2rem,8vw,3rem);font-weight:800;margin:12px 0}.card-example{font-size:clamp(.94rem,3vw,1.1rem);color:#336779}.card-hint{font-size:.8rem;color:#758e97;margin-top:15px}.controls{display:flex;gap:8px;justify-content:center;margin:15px 0}.controls button{min-width:100px}.trainer-note{font-size:.82rem;color:#658392}.direction{display:flex;align-items:center;gap:8px;margin:0 0 10px}.direction button{font-size:.85rem;padding:7px 12px}@media(max-height:700px){.trainer-wrap{margin:8px auto}.trainer-wrap h1{margin:8px 0 2px}.flip-card{min-height:180px;padding:12px}.card-word{margin:5px 0}.card-hint{margin-top:8px}.controls{margin:8px 0}}
