<text x="330" y="397" font-size="17" fill="#64748b">yo</text><text x="870" y="397" font-size="17" fill="#64748b">nosotros / nosotras</text><text x="330" y="532" font-size="17" fill="#64748b">tú</text><text x="870" y="532" font-size="17" fill="#64748b">vosotros / vosotras</text><text x="330" y="667" font-size="17" fill="#64748b">él / ella / usted</text><text x="870" y="667" font-size="17" fill="#64748b">ellos / ellas / ustedes</text>
<text x="330" y="450" font-size="34" font-weight="700">p<tspan fill="#d62828">i</tspan>do</text><text x="870" y="450" font-size="34" font-weight="700">p<tspan fill="#2f9e44">e</tspan>dimos</text><text x="330" y="585" font-size="34" font-weight="700">p<tspan fill="#d62828">i</tspan>des</text><text x="870" y="585" font-size="34" font-weight="700">p<tspan fill="#2f9e44">e</tspan>dís</text><text x="330" y="720" font-size="34" font-weight="700">p<tspan fill="#d62828">i</tspan>de</text><text x="870" y="720" font-size="34" font-weight="700">p<tspan fill="#d62828">i</tspan>den</text></g>
